[project]
name = "liveinspect-agent"
version = "0.1.0"
description = "LiveInspectAI Local Windows AI Inference Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "websockets>=13.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.8.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
